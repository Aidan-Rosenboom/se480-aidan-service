openapi: 3.1.0
info:
  title: Patch Notes API
  version: 1.0.0
  license:
    name: Unlicensed
    identifier: NOASSERTION
  description: |
    API for retrieving Steam patch notes and sharing user-posted patch note
    summaries. The current API version is v1. Authentication is described for
    a future version: user passwords are not currently set or verified, and
    access tokens are not currently required by any operation. Within a
    version, existing paths, methods, request fields, response shapes, and
    status-code meanings will not change incompatibly; additive fields and
    endpoints may be added.
servers:
  - url: https://se480-aidan-service.onrender.com/{version}
    description: Production server
    variables:
      version:
        description: API major version.
        default: v1
        enum: [v1]
security: []
tags:
  - name: Users
    description: User account operations.
  - name: Patch note summaries
    description: User-posted patch note summary operations.
  - name: Steam patch notes
    description: Steam patch note retrieval operations.
paths:
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Return all users registered with the service.
      operationId: listUsers
      responses:
        '200':
          description: Users returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  first_name: Aidan
                  last_name: Rosenboom
                  steam_id: '76561198012345678'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Create a user
      description: Register a user and return the newly created user.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUser'
            example:
              first_name: Aidan
              last_name: Rosenboom
              steam_id: '76561198012345678'
      responses:
        '201':
          description: User created successfully.
          headers:
            Location:
              description: URL of the newly created user.
              schema:
                type: string
                format: uri
              example: https://se480-aidan-service.onrender.com/v1/users/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                first_name: Aidan
                last_name: Rosenboom
                steam_id: '76561198012345678'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get one user
      description: Return a user identified by their user ID.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                first_name: Aidan
                last_name: Rosenboom
                steam_id: '76561198012345678'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patch-note-summaries:
    get:
      tags: [Patch note summaries]
      summary: List patch note summaries for a game
      description: Return user-posted patch note summaries for a game.
      operationId: listPatchNoteSummaries
      parameters:
        - $ref: '#/components/parameters/GameIdQuery'
      responses:
        '200':
          description: Patch note summaries returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatchNoteSummary'
              example:
                - user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  summary_id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  game_id: '10'
                  text_content: Added a new map and balance changes to ranked play.
                  link: https://example.com/summary
                  title: Season update
                  update_version: '1.4.0'
                  created_at: '2026-11-04T04:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Patch note summaries]
      summary: Create a user-posted patch note summary
      description: Create and return a user-posted patch note summary.
      operationId: createPatchNoteSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNoteSummaryInput'
            example:
              user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              game_id: '10'
              text_content: Added a new map and balance changes to ranked play.
              link: https://example.com/summary
              title: Season update
              update_version: '1.4.0'
      responses:
        '201':
          description: Patch note summary created successfully.
          headers:
            Location:
              description: URL of the newly created patch note summary.
              schema:
                type: string
                format: uri
              example: https://se480-aidan-service.onrender.com/v1/patch-note-summaries/6ba7b810-9dad-11d1-80b4-00c04fd430c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchNoteSummary'
              example:
                summary_id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                game_id: '10'
                text_content: Added a new map and balance changes to ranked play.
                link: https://example.com/summary
                title: Season update
                update_version: '1.4.0'
                created_at: '2026-11-04T04:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patch-note-summaries/{summary_id}:
    get:
      tags: [Patch note summaries]
      summary: Get one patch note summary for a game
      description: Return a patch note summary identified by its summary ID.
      operationId: getPatchNoteSummary
      parameters:
        - $ref: '#/components/parameters/SummaryId'
        - $ref: '#/components/parameters/GameIdQuery'
      responses:
        '200':
          description: Patch note summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchNoteSummary'
              example:
                user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                summary_id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                game_id: '10'
                text_content: Added a new map and balance changes to ranked play.
                link: https://example.com/summary
                title: Season update
                update_version: '1.4.0'
                created_at: '2026-11-04T04:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Patch note summaries]
      summary: Delete one patch note summary
      description: Permanently delete a user-posted patch note summary.
      operationId: deletePatchNoteSummary
      parameters:
        - $ref: '#/components/parameters/SummaryId'
      responses:
        '204':
          description: Patch note summary deleted successfully.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /steam-patch-notes:
    get:
      tags: [Steam patch notes]
      summary: Fetch patch notes for a game from Steam's API
      description: Return patch notes retrieved from Steam for a game.
      operationId: getSteamPatchNotes
      parameters:
        - $ref: '#/components/parameters/GameIdQuery'
      responses:
        '200':
          description: Steam patch notes returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SteamPatchNote'
              example:
                - game_id: '10'
                  text_content: Improved matchmaking and fixed crash issues.
                  link: https://store.steampowered.com/news/app/10
                  title: Maintenance update
                  update_version: '2026.11.04'
                  published_at: '2026-11-04T03:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: Opaque user identifier.
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    SummaryId:
      name: summary_id
      in: path
      required: true
      description: Opaque patch note summary identifier.
      schema:
        type: string
        format: uuid
      example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
    GameIdQuery:
      name: game_id
      in: query
      required: true
      description: Steam application identifier used to select one game.
      schema:
        type: string
        minimum: 1
      example: '10'
  responses:
    ValidationError:
      description: The request is missing or contains invalid data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/validation-error
            title: Validation error
            status: 400
            detail: game_id must be a positive integer.
            instance: /v1/patch-note-summaries
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/not-found
            title: Not found
            status: 404
            detail: No resource matched the supplied identifier.
            instance: /v1/patch-note-summaries/6ba7b810-9dad-11d1-80b4-00c04fd430c8
    ConflictError:
      description: The request conflicts with the current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/conflict
            title: Conflict
            status: 409
            detail: A resource with the supplied unique value already exists.
            instance: /v1/users
    UnauthorizedError:
      description: Authentication is required or the supplied credentials are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required or the supplied credentials are invalid.
            instance: /v1/sessions
    ForbiddenError:
      description: The authenticated client is not permitted to perform the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/forbidden
            title: Forbidden
            status: 403
            detail: The authenticated client is not permitted to perform the operation.
            instance: /v1/steam-patch-notes
    InternalServerError:
      description: An unexpected server-side failure occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/internal-server-error
            title: Internal server error
            status: 500
            detail: An unexpected server error occurred.
            instance: /v1/users
    ServiceUnavailableError:
      description: A required upstream service is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.example.com/problems/service-unavailable
            title: Service unavailable
            status: 503
            detail: Steam's API is temporarily unavailable.
            instance: /v1/steam-patch-notes
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457-style problem-details document.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the type of problem.
          example: https://api.example.com/problems/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          example: Validation error
        status:
          type: integer
          description: HTTP status code for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: game_id must be a positive integer.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the request or occurrence.
          example: /v1/patch-note-summaries
    User:
      type: object
      description: A registered user account.
      required: [user_id, first_name, last_name, steam_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the user.
        first_name:
          type: string
          description: User's first name.
          example: Aidan
        last_name:
          type: string
          description: User's last name.
          example: Rosenboom
        steam_id:
          type: string
          description: Steam identifier associated with the user.
          example: '76561198012345678'
    RegisterUser:
      type: object
      description: Fields required to register a user.
      required: [first_name, last_name, steam_id]
      properties:
        first_name:
          type: string
          description: User's first name.
        last_name:
          type: string
          description: User's last name.
        steam_id:
          type: string
          description: Steam identifier associated with the user.
          example: '76561198012345678'
    PatchNoteSummaryInput:
      type: object
      description: Fields supplied when posting a patch note summary.
      required: [user_id, game_id, text_content, update_version]
      properties:
        user_id:
          type: string
          format: uuid
          description: Identifier of the user posting the summary.
        game_id:
          type: string
          description: Steam application identifier for the game.
          example: '123123'
        text_content:
          type: string
          minLength: 1
          description: User-written summary of the patch note.
        link:
          type: string
          format: uri
          description: Optional URL with additional information about the summary.
        title:
          type: string
          description: Optional title for the summary.
        update_version:
          type: string
          minLength: 1
          description: Version identifier of the game update.
    PatchNoteSummary:
      allOf:
        - $ref: '#/components/schemas/PatchNoteSummaryInput'
        - type: object
          description: A user-posted patch note summary returned by the service.
          required: [summary_id, created_at]
          properties:
            summary_id:
              type: string
              format: uuid
              description: Unique identifier assigned to the summary.
            created_at:
              type: string
              format: date-time
              description: Time at which the summary was created.
    SteamPatchNote:
      type: object
      description: A patch note retrieved from Steam.
      required: [game_id, text_content, update_version, published_at]
      properties:
        game_id:
          type: string
          description: Steam application identifier for the game.
          example: '123123'
        text_content:
          type: string
          description: Patch note content retrieved from Steam.
        link:
          type: string
          format: uri
          description: URL of the patch note on Steam.
        title:
          type: string
          description: Optional title of the patch note.
        update_version:
          type: string
          description: Version identifier of the game update.
        published_at:
          type: string
          format: date-time
          description: Time at which Steam published the patch note.
